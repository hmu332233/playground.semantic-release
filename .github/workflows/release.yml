name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - custom/main

permissions:
  contents: write  # 버전 태그를 push하기 위해 필요

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    
    # custom/main 브랜치에서만 실행되도록 조건 추가
    if: github.ref == 'refs/heads/custom/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # 3. npm 캐시 설정
      - name: Cache npm dependencies
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-semantic-release-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-semantic-release-

      # 4. semantic-release 관련 의존성만 설치
      - name: Install semantic-release dependencies
        run: npm install @semantic-release/git @semantic-release/changelog -D

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: minungHan
          GIT_AUTHOR_EMAIL: hmu332233@gmail.com
        run: npx semantic-release
  merge-to-develop:
    runs-on: ubuntu-latest
    needs: release
    
    steps:
    # 1. 저장소 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    # 2. Git 설정
    - name: Set up Git config
      run: |
        git config user.name "minung.han"
        git config user.email "hmu332233@gmail.com"
        
    # 3. 머지 시도 및 충돌 체크
    - name: Try merge master into develop
      id: merge
      run: |
        git checkout custom/develop
        git pull origin custom/develop
        if git merge custom/main --no-edit; then
          echo "Merge successful"
          git push origin custom/develop
          echo "success=true" >> $GITHUB_OUTPUT
        else
          echo "Merge conflict detected"
          git merge --abort
          echo "success=false" >> $GITHUB_OUTPUT
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    # 4. 충돌 발생시 에러 핸들링
    - name: Check Merge conflict
      if: steps.merge.outputs.success == 'false'
      run: exit 1  # 실패 상태로 종료 / 추후 slack 알림 등으로 변경
